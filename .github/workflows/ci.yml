name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for PDF reports
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Install
        run: pip install -r requirements.txt pytest pytest-asyncio aiosqlite
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API and worker image
        run: docker build -t sitescore-backend ./backend
      - name: Build web app image
        run: docker build --build-arg VITE_API_BASE=https://api-sitescore.maktechgroup.com -t sitescore-web ./frontend
      - name: Smoke test the backend image
        run: |
          docker run --rm -e SITESCORE_ROLE=check -e SITESCORE_ENV=development sitescore-backend python -c "import weasyprint, sitescore.api; from sitescore.report import render_pdf; print('backend image ok')"
          docker run --rm -e SITESCORE_ROLE=check sitescore-backend python -m sitescore --help > /dev/null
          docker run --rm -e SITESCORE_ROLE=check sitescore-backend python -c "from pathlib import Path; import sitescore; assert (Path(sitescore.__file__).parent / 'assets/fonts/Inter-Regular.otf').exists(); print('fonts ok')"
          docker run --rm -e SITESCORE_ROLE=check sitescore-backend sh -c "lighthouse --version && chromium --version"
      - name: Speed test runs in the image (real browser, real website)
        run: docker run --rm -e SITESCORE_ROLE=check -e SITESCORE_ENV=development sitescore-backend python -m sitescore test-speed example.com
